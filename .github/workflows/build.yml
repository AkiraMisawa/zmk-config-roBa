# Builds the firmware described by keyballer.json with Keyballer's reusable workflow and
# publishes it on the `firmware` branch for the Keyballer app.
name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-firmware
  cancel-in-progress: true

jobs:
  build:
    uses: AkiraMisawa/keyballer/.github/workflows/build-zmk.yml@main
    permissions:
      contents: write
